spring.application.name=procureflow

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/procureflow;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null

server.port=8080

security.jwt.issuer=procureflow-api
security.jwt.expiration-minutes=30

# LOCAL DEVELOPMENT ONLY.
# Replace this with your own secret or environment variable.
security.jwt.secret=${JWT_SECRET_BASE64:UHJvY3VyZUZsb3ctTG9jYWwtRGV2LVNlY3JldC0zMkI=}

logging.level.org.springframework.security=INFO
logging.level.com.procureflow=INFO

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@procureflow.com}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
